{% extends "admin/change_list.html" %}
{% load i18n static %}

{% block extrastyle %}
{{ block.super }}
<style>
  .parser-banner { display:flex; align-items:center; gap:16px; padding:14px 20px; background:#fff; border:1px solid #eee; border-radius:8px; margin:20px 0 0 0; }
  .parser-banner h3 { margin:0; font-size:15px; }
  .parser-btn { display:inline-block; padding:10px 24px; background:#1a1a2e; color:#fff; text-decoration:none; border-radius:8px; font-weight:600; font-size:14px; white-space:nowrap; }
  .parser-btn:hover { opacity:0.9; color:#fff; }
  .last-run { font-size:13px; color:#666; }
  .last-run .status-success { color:#28a745; font-weight:600; }
  .last-run .status-failed { color:#dc3545; font-weight:600; }
  .last-run .status-running { color:#ffc107; font-weight:600; }
</style>
{% endblock %}

{% block object-tools-items %}
{% if parser_url %}
<li>
  <a href="{{ parser_url }}" class="btn btn-success" style="background:#1a1a2e;color:#fff;padding:8px 16px;border-radius:6px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    Запустить парсер
  </a>
</li>
{% endif %}
{{ block.super }}
{% endblock %}
