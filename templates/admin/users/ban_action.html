{% extends "admin/base_site.html" %}

{% block content %}
<div id="content-main">
  <h1>{{ title }}</h1>
  <p>Будут заблокированы:</p>
  <ul>
    {% for user in users %}
      <li>{{ user.email }}</li>
    {% endfor %}
  </ul>
  <form method="post">
    {% csrf_token %}
    {% for user in users %}
      <input type="hidden" name="{{ action_checkbox_name }}" value="{{ user.pk }}">
    {% endfor %}
    <input type="hidden" name="action" value="{{ action_name }}">
    <input type="hidden" name="select_across" value="{{ select_across }}">
    <input type="hidden" name="ban_apply" value="1">
    <div style="margin: 16px 0;">
      <label for="ban_reason" style="display:block; font-weight:600; margin-bottom:6px;">Причина</label>
      <textarea id="ban_reason" name="ban_reason" rows="4" style="width:min(520px, 100%); padding:8px;"></textarea>
    </div>
    {% if timed %}
    <div style="margin: 16px 0;">
      <label for="days" style="display:block; font-weight:600; margin-bottom:6px;">Дней</label>
      <input id="days" name="days" type="number" min="1" max="3650" value="7" style="width:120px; padding:8px;">
    </div>
    {% endif %}
    <button type="submit" class="button" style="padding:8px 16px;">Заблокировать</button>
    <a href="{% url 'admin:users_user_changelist' %}" style="margin-left:12px;">Отмена</a>
  </form>
</div>
{% endblock %}
