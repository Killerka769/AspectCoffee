<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block email_title %}Aspect Coffee{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#0a0a0a;-webkit-font-smoothing:antialiased;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:40px 20px;">
  <tr>
    <td align="center">
      <table role="presentation" width="488" cellpadding="0" cellspacing="0" style="max-width:488px;width:100%;">
        <tr>
          <td style="padding:0 0 24px 0;text-align:center;">
            <img src="https://aspectcoffee.ru/static/asset/images/logo-aspect.svg" alt="Aspect Coffee" width="120" height="72" style="display:inline-block;border:0;">
          </td>
        </tr>
        <tr>
          <td style="background:#ffffff;border-radius:24px;padding:24px 32px;">
            {% block email_content %}{% endblock %}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
