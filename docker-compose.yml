services:
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: aspectcoffee-site
    restart: always
    env_file: .env.prod
    volumes:
      - ./media:/app/media
      - ./db.sqlite3:/app/data/db.sqlite3
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    # ports:
    #   - "8000:8000"

  celery:
    build: .
    image: aspectcoffee-site
    restart: always
    env_file: .env.prod
    volumes:
      - ./media:/app/media
      - ./db.sqlite3:/app/data/db.sqlite3
    depends_on:
      redis:
        condition: service_healthy
    # SQLite permits one writer at a time. A single Celery worker prevents
    # simultaneous email/push tasks from failing with "database is locked".
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=1"]

  celery-beat:
    build: .
    image: aspectcoffee-site
    restart: always
    env_file: .env.prod
    volumes:
      - ./media:/app/media
      - ./db.sqlite3:/app/data/db.sqlite3
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "beat", "-l", "info"]

  nginx:
    image: nginx:1.25-alpine
    restart: always
    # ports:
    #   - "80:80"
    #   - "443:443"
    ports:
      - "10.88.0.1:80:80"
      - "10.88.0.1:443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/proxy_params.conf:/etc/nginx/conf.d/proxy_params.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 6h & wait $${!}; certbot renew; done'"

volumes:
  certbot_www:
  certbot_conf:
