user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    client_max_body_size 20M;

    server {
        listen 80;
        server_name test.aspectcoffee.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://test.aspectcoffee.ru$request_uri;
        }
    }

    # Internal VPN endpoint for QA tools. Public requests keep using the
    # hostname above and are redirected to HTTPS.
    server {
        listen 80 default_server;
        server_name 10.88.0.1 localhost;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        location /static/ {
            alias /app/staticfiles/;
            expires 1h;
            add_header Cache-Control "private, no-store";
        }

        location /media/ {
            alias /app/media/;
            expires 1h;
            add_header Cache-Control "private, no-store";
        }

        location / {
            proxy_pass http://web:8000;
            proxy_http_version 1.1;
            proxy_set_header Host test.aspectcoffee.ru;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name test.aspectcoffee.ru;

        ssl_certificate /etc/letsencrypt/live/test.aspectcoffee.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/test.aspectcoffee.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TEST_SSL:5m;
        ssl_session_timeout 1d;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        location /static/ {
            alias /app/staticfiles/;
            expires 1h;
            add_header Cache-Control "private, no-store";
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        }

        location /media/ {
            alias /app/media/;
            expires 1h;
            add_header Cache-Control "private, no-store";
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        }

        # Production payment and deployment callbacks are never accepted here.
        location = /payments/webhook/ { return 404; }
        location = /balance/webhook/ { return 404; }
        location = /webhook/deploy/ { return 404; }

        location / {
            proxy_pass http://web:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }
    }

    # Requests to the test hostname from IPs not present in the HAProxy
    # allowlist are routed here. TLS completes normally, then HTTP returns 503.
    server {
        listen 444 ssl;
        http2 on;
        server_name test.aspectcoffee.ru;

        ssl_certificate /etc/letsencrypt/live/test.aspectcoffee.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/test.aspectcoffee.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Retry-After "3600" always;
        return 503;
    }
}
