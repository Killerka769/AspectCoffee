user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --------------------------------------------------------
    # Logging
    # --------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;  # скрываем версию Nginx

    # --------------------------------------------------------
    # Gzip compression
    # --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # --------------------------------------------------------
    # Rate limiting (защита от DDoS)
    # --------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # --------------------------------------------------------
    # IP address -> domain redirect
    # --------------------------------------------------------
    server {
        listen 80;
        server_name 45.155.52.48;
        return 301 https://aspectcoffee.ru$request_uri;
    }

    # --------------------------------------------------------
    # HTTP apex domain
    # --------------------------------------------------------
    server {
        listen 80;
        server_name aspectcoffee.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://aspectcoffee.ru$request_uri;
        }
    }

    # --------------------------------------------------------
    # HTTP www -> apex redirect
    # --------------------------------------------------------
    server {
        listen 80;
        server_name www.aspectcoffee.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://aspectcoffee.ru$request_uri;
        }
    }

    # --------------------------------------------------------
    # Fallback HTTP
    # --------------------------------------------------------
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://aspectcoffee.ru$request_uri;
        }
    }

    # --------------------------------------------------------
    # HTTPS main server
    # --------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name aspectcoffee.ru;

        ssl_certificate     /etc/letsencrypt/live/aspectcoffee.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aspectcoffee.ru/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # --------------------------------------------------------
        # Security headers
        # --------------------------------------------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;

        # --------------------------------------------------------
        # Mail.ru domain verification
        # --------------------------------------------------------
        location = /mailru-domainpLcEAyzQaQsZtTga.html {
            alias /app/staticfiles/mailru-domainpLcEAyzQaQsZtTga.html;
        }

        # --------------------------------------------------------
        # Static files (раздаются Nginx напрямую, без Django)
        # --------------------------------------------------------
        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /media/ {
            alias /app/media/;
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        # --------------------------------------------------------
        # API endpoints — отдельный rate limit
        # --------------------------------------------------------
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /admin/ {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # --------------------------------------------------------
        # Payment webhooks — restrict to official YooKassa notification IPs
        # (defense-in-depth; app also verifies each payment via YooKassa API)
        # --------------------------------------------------------
        location = /payments/webhook/ {
            allow 185.71.76.0/27;
            allow 185.71.77.0/27;
            allow 77.75.153.0/25;
            allow 77.75.156.11;
            allow 77.75.156.35;
            allow 77.75.154.128/25;
            allow 2a02:5180::/32;
            deny all;
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location = /balance/webhook/ {
            allow 185.71.76.0/27;
            allow 185.71.77.0/27;
            allow 77.75.153.0/25;
            allow 77.75.156.11;
            allow 77.75.156.35;
            allow 77.75.154.128/25;
            allow 2a02:5180::/32;
            deny all;
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

    # --------------------------------------------------------
    # Main Django application
    # --------------------------------------------------------
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 20M;
    }

        # --------------------------------------------------------
        # Certbot renewal
        # --------------------------------------------------------
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # --------------------------------------------------------
    # HTTPS www -> apex redirect
    # --------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name www.aspectcoffee.ru;

        ssl_certificate     /etc/letsencrypt/live/aspectcoffee.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aspectcoffee.ru/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        return 301 https://aspectcoffee.ru$request_uri;
    }
}
