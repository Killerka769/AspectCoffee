<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2A4A34">
  <title>Нет сети — Aspect Coffee</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #F4F6F4;
      color: #000;
      font-family: "Open Sans", Arial, sans-serif;
    }
    main {
      width: min(420px, calc(100% - 32px));
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-family: "Roboto Condensed", Arial, sans-serif;
      font-weight: 900;
      font-size: 32px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    p { margin: 0 0 24px; color: #5A5A5A; line-height: 1.5; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 24px;
      background: #2A4A34;
      color: #fff;
      text-decoration: none;
      font-family: "Roboto Condensed", Arial, sans-serif;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <h1>Вы офлайн</h1>
    <p>Сети нет. Корзина и заказы откроются, когда связь вернётся.</p>
    <a href="/basket/">Открыть корзину</a>
  </main>
</body>
</html>
