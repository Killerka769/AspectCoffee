{% if active_popup %}
<div class="asp-popup asp-popup--{{ active_popup.placement }}{% if active_popup.placement == 'edge' %} asp-popup--{{ active_popup.side }}{% endif %}"
     data-popup hidden
     data-placement="{{ active_popup.placement }}"
     data-delay="{{ active_popup.delay_seconds }}"
     data-storage-key="asp-popup-{{ active_popup.pk }}-{{ active_popup.updated_at|date:'U' }}"
     role="dialog"
     aria-modal="{% if active_popup.placement == 'edge' %}false{% else %}true{% endif %}"
     aria-labelledby="asp-popup-title">
  <div class="asp-popup__scrim" data-popup-scrim></div>
  <div class="asp-popup__burst" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="asp-popup__card">
    <button type="button" class="asp-popup__x" data-popup-close aria-label="Закрыть">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    {% if active_popup.image %}
      <img class="asp-popup__image" src="{{ active_popup.image.url }}" alt="">
    {% endif %}
    <div class="asp-popup__copy">
      <h2 class="asp-popup__title" id="asp-popup-title">{{ active_popup.title }}</h2>
      <p class="asp-popup__text">{{ active_popup.text|linebreaksbr }}</p>
      {% if active_popup.button_text %}
        {% if active_popup.button_link %}
          <a class="asp-popup__cta" href="{{ active_popup.button_link }}" data-popup-go>{{ active_popup.button_text }}</a>
        {% else %}
          <button type="button" class="asp-popup__cta" data-popup-close>{{ active_popup.button_text }}</button>
        {% endif %}
      {% endif %}
    </div>
  </div>
</div>
<style>
.asp-popup[hidden] { display: none; }
.asp-popup {
  position: fixed;
  inset: 0;
  z-index: 400;
  display: grid;
  place-items: center;
  padding: 24px;
}
.asp-popup__scrim {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at center, rgba(42, 74, 52, .18), transparent 62%),
    rgba(8, 16, 12, .66);
  opacity: 0;
  transition: opacity .45s ease;
}
.asp-popup--screen.is-open .asp-popup__scrim { opacity: 1; }
.asp-popup__burst {
  position: absolute;
  width: 280px;
  height: 280px;
  pointer-events: none;
}
.asp-popup__burst span {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  background: #C7E0CC;
  opacity: 0;
}
.asp-popup--screen.is-open .asp-popup__burst span { animation: asp-pop-spark .9s ease-out forwards; }
.asp-popup__burst span:nth-child(1) { animation-delay: .05s; --x: -90px; --y: -70px; background: #2A4A34; }
.asp-popup__burst span:nth-child(2) { animation-delay: .12s; --x: 100px; --y: -50px; }
.asp-popup__burst span:nth-child(3) { animation-delay: .08s; --x: -110px; --y: 30px; background: #fff; }
.asp-popup__burst span:nth-child(4) { animation-delay: .16s; --x: 80px; --y: 70px; background: #8FB89A; }
.asp-popup__burst span:nth-child(5) { animation-delay: .02s; --x: 10px; --y: -110px; }
.asp-popup__burst span:nth-child(6) { animation-delay: .2s; --x: -20px; --y: 100px; background: #2A4A34; }
@keyframes asp-pop-spark {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.2); }
  30% { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1); }
}
.asp-popup__card {
  position: relative;
  z-index: 1;
  width: min(460px, 100%);
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 28px 80px rgba(0, 0, 0, .32);
  text-align: center;
  overflow: hidden;
}
.asp-popup--screen .asp-popup__card {
  opacity: 0;
  transform: translateY(28px) scale(.96);
}
.asp-popup--screen .asp-popup__card::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 4px;
  background: linear-gradient(90deg, #1d3324, #2A4A34 42%, #8FB89A);
  z-index: 2;
}
.asp-popup--screen.is-open .asp-popup__card {
  animation: asp-pop-card .65s cubic-bezier(.16, 1.16, .32, 1) forwards;
}
@keyframes asp-pop-card {
  0% { opacity: 0; transform: translateY(32px) scale(.94); }
  100% { opacity: 1; transform: none; }
}
.asp-popup__x {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 3;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, .92);
  color: #000;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .12);
}
.asp-popup__x svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
.asp-popup--screen .asp-popup__image {
  display: block;
  width: 100%;
  height: 190px;
  object-fit: cover;
  margin: 0;
}
.asp-popup--screen .asp-popup__copy { padding: 28px 32px 32px; }
.asp-popup__title {
  margin: 0 0 12px;
  font-family: "Roboto Condensed", Arial, sans-serif;
  font-weight: 900;
  font-size: 32px;
  line-height: 1.05;
  letter-spacing: .02em;
  text-transform: uppercase;
  color: #000;
}
.asp-popup__title::after {
  content: "";
  display: block;
  width: 48px;
  height: 3px;
  margin: 12px auto 0;
  background: #2A4A34;
}
.asp-popup__text {
  margin: 0 0 22px;
  color: #5A5A5A;
  font-size: 15px;
  line-height: 1.55;
}
.asp-popup__cta {
  position: relative;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 0 28px;
  border: 0;
  border-radius: 4px;
  background: #2A4A34;
  color: #fff;
  font-family: "Roboto Condensed", Arial, sans-serif;
  font-weight: 900;
  font-size: 14px;
  letter-spacing: .1em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}
.asp-popup__cta::after {
  content: "";
  position: absolute;
  top: 0;
  left: -40%;
  width: 30%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
  transform: skewX(-20deg);
  animation: asp-pop-shine 2.8s ease-in-out infinite;
}
@keyframes asp-pop-shine {
  0%, 55% { left: -40%; }
  85%, 100% { left: 130%; }
}

.asp-popup--edge {
  display: block;
  padding: 0;
  pointer-events: none;
}
.asp-popup--edge .asp-popup__scrim,
.asp-popup--edge .asp-popup__burst { display: none; }
.asp-popup--edge .asp-popup__card {
  position: fixed;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  width: min(400px, calc(100% - 32px));
  max-height: calc(100% - 120px);
  padding: 18px;
  overflow: auto;
  text-align: left;
  pointer-events: auto;
  opacity: 0;
  box-shadow: 0 18px 50px rgba(16, 32, 22, .22), 0 0 0 1px rgba(42, 74, 52, .08);
  transition: transform .5s cubic-bezier(.16, 1, .3, 1), opacity .35s ease;
}
.asp-popup--edge .asp-popup__image {
  width: 76px;
  height: 76px;
  flex: none;
  object-fit: cover;
  border-radius: 12px;
  margin: 0;
}
.asp-popup--edge .asp-popup__copy {
  flex: 1;
  min-width: 0;
  padding: 2px 28px 0 0;
}
.asp-popup--edge .asp-popup__title { font-size: 22px; }
.asp-popup--edge .asp-popup__title::after { margin: 8px 0 0; }
.asp-popup--edge .asp-popup__text { margin-bottom: 14px; font-size: 14px; }
.asp-popup--edge .asp-popup__cta { min-height: 42px; padding: 0 18px; }

.asp-popup--right .asp-popup__card {
  top: 50%;
  right: 16px;
  border-right: 4px solid #2A4A34;
  transform: translate(calc(100% + 32px), -50%);
}
.asp-popup--left .asp-popup__card {
  top: 50%;
  left: 16px;
  border-left: 4px solid #2A4A34;
  transform: translate(calc(-100% - 32px), -50%);
}
.asp-popup--top .asp-popup__card {
  top: 96px;
  left: 50%;
  width: min(480px, calc(100% - 32px));
  border-top: 4px solid #2A4A34;
  transform: translate(-50%, calc(-100% - 24px));
}
.asp-popup--bottom .asp-popup__card {
  bottom: max(16px, env(safe-area-inset-bottom));
  left: 50%;
  width: min(480px, calc(100% - 32px));
  border-bottom: 4px solid #2A4A34;
  transform: translate(-50%, calc(100% + 32px));
}
.asp-popup--edge.is-open.asp-popup--right .asp-popup__card,
.asp-popup--edge.is-open.asp-popup--left .asp-popup__card { transform: translate(0, -50%); opacity: 1; }
.asp-popup--edge.is-open.asp-popup--top .asp-popup__card,
.asp-popup--edge.is-open.asp-popup--bottom .asp-popup__card { transform: translate(-50%, 0); opacity: 1; }

body.asp-popup-lock { overflow: hidden; }
@media (max-width: 480px) {
  .asp-popup--screen { padding: 16px; }
  .asp-popup--screen .asp-popup__image { height: 148px; }
  .asp-popup--screen .asp-popup__copy { padding: 22px 20px 24px; }
  .asp-popup__title { font-size: 26px; }
  .asp-popup--edge .asp-popup__title { font-size: 20px; }
  .asp-popup--edge .asp-popup__card { width: calc(100% - 16px); }
  .asp-popup--right .asp-popup__card { right: 8px; }
  .asp-popup--left .asp-popup__card { left: 8px; }
  .asp-popup--top .asp-popup__card { top: 84px; width: calc(100% - 16px); }
  .asp-popup--bottom .asp-popup__card { width: calc(100% - 16px); }
}
</style>
<script>
(function () {
  var root = document.querySelector("[data-popup]");
  if (!root) return;
  var key = root.getAttribute("data-storage-key");
  try {
    if (window.localStorage.getItem(key)) return;
  } catch (err) {}

  var delay = parseInt(root.getAttribute("data-delay") || "5", 10);
  if (isNaN(delay) || delay < 0) delay = 5;
  var fullscreen = root.getAttribute("data-placement") !== "edge";

  function remember() {
    try { window.localStorage.setItem(key, "1"); } catch (err) {}
  }

  function openPopup() {
    root.hidden = false;
    window.requestAnimationFrame(function () {
      root.classList.add("is-open");
      if (fullscreen) document.body.classList.add("asp-popup-lock");
    });
  }

  function closePopup() {
    remember();
    root.classList.remove("is-open");
    document.body.classList.remove("asp-popup-lock");
    window.setTimeout(function () { root.hidden = true; }, 480);
  }

  window.setTimeout(openPopup, delay * 1000);
  root.querySelectorAll("[data-popup-close], [data-popup-scrim]").forEach(function (node) {
    node.addEventListener("click", closePopup);
  });
  var go = root.querySelector("[data-popup-go]");
  if (go) go.addEventListener("click", remember);
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && root.classList.contains("is-open")) closePopup();
  });
})();
</script>
{% endif %}
