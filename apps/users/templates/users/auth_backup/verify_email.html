{% extends "catalog/base.html" %}
{% load static %}

{% block title %}Подтверждение email{% endblock %}

{% block content %}
<main class="tc-auth-page bg-[#fafafa] min-h-screen flex items-center justify-center p-6 pt-20">
    <div class="tc-auth-wrap w-full max-w-md">
        <div class="tc-auth-card bg-white rounded-[40px] border border-gray-100 p-10 md:p-14 shadow-2xl shadow-gray-200/50">
            <div class="tc-auth-head text-center mb-10">
                <h1 class="text-4xl font-din-black uppercase tracking-tight mb-3">Подтверждение email</h1>
                <p class="text-black/40 text-sm font-medium">Введите 6-значный код из письма</p>
            </div>

            {% if messages %}
            <div class="space-y-3 mb-8">
                {% for message in messages %}
                <div class="p-4 rounded-xl {% if message.tags == 'error' %}bg-red-50 text-red-600 border border-red-100{% elif message.tags == 'success' %}bg-green-50 text-green-600 border border-green-100{% else %}bg-blue-50 text-blue-600 border border-blue-100{% endif %} text-xs font-bold">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post" class="tc-auth-form space-y-6">
                {% csrf_token %}
                <div class="space-y-1.5 focus-within:text-black text-gray-400 group">
                    <label class="text-[11px] font-black uppercase tracking-widest leading-none ml-2">Код подтверждения</label>
                    <input type="text" name="code" required placeholder="000000" maxlength="6" pattern="[0-9]{6}"
                           autocomplete="one-time-code"
                           class="w-full bg-gray-50 border border-gray-100 rounded-2xl px-5 py-4 text-black text-2xl text-center tracking-[0.3em] font-bold focus:outline-none focus:border-black focus:bg-white transition-all">
                </div>
                <button type="submit"
                        class="w-full bg-black text-white hover:bg-gray-800 py-5 rounded-[20px] font-din-black text-lg uppercase tracking-widest transition-all shadow-xl shadow-black/10 flex items-center justify-center gap-3 group">
                    Подтвердить
                    <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                </button>
            </form>
        </div>
    </div>
</main>
{% endblock %}
