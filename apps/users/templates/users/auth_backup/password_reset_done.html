{% extends "catalog/base.html" %}
{% load static %}
{% block title %}Письмо отправлено{% endblock %}
{% block content %}
<main class="tc-auth-page bg-[#fafafa] min-h-screen flex items-center justify-center p-6 pt-20">
    <div class="tc-auth-wrap w-full max-w-md">
        <div class="tc-auth-card bg-white rounded-[40px] border border-gray-100 p-10 md:p-14 shadow-2xl shadow-gray-200/50 text-center">
            <div class="w-16 h-16 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h1 class="text-3xl font-din-black uppercase tracking-tight mb-3">Проверьте почту</h1>
            <p class="text-black/40 text-sm font-medium leading-relaxed">Мы отправили инструкцию по сбросу пароля на ваш email. Если письмо не пришло, проверьте папку «Спам».</p>
            <a href="{% url 'login' %}" class="mt-8 inline-block text-sm font-bold uppercase tracking-widest text-black underline underline-offset-4">Вернуться ко входу</a>
        </div>
    </div>
</main>
{% endblock %}
