{% extends "users/base_account.html" %}
{% load static %}

{% block title %}Смена пароля{% endblock %}

{% block account_content %}
<div class="col-span-12 xl:col-span-7 2xl:col-span-6 space-y-8">
  <h2 class="text-[24px] md:text-[32px] font-din-black uppercase leading-[1.2] m-0">Смена пароля</h2>

  {% if messages %}
  <div class="space-y-2">
    {% for message in messages %}
    <div class="p-3 rounded-lg text-[14px]" style="background:{% if message.tags == 'success' %}#d1fae5;color:#065f46{% else %}#fee2e2;color:#991b1b{% endif %};">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}

  <form method="post" action="{% url 'users:change_password' %}" class="space-y-6 max-w-md">
    {% csrf_token %}
    <div class="tc-input">
      <div class="tc-input__field">
        <input type="password" name="current_password" placeholder="Текущий пароль" class="tc-input__field--input" required autocomplete="current-password">
      </div>
    </div>
    <div class="tc-input">
      <div class="tc-input__field">
        <input type="password" name="new_password" placeholder="Новый пароль" class="tc-input__field--input" required minlength="8" autocomplete="new-password">
      </div>
    </div>
    <div class="tc-input">
      <div class="tc-input__field">
        <input type="password" name="new_password2" placeholder="Подтвердите новый пароль" class="tc-input__field--input" required minlength="8" autocomplete="new-password">
      </div>
    </div>
    <div class="space-y-2">
      <button type="submit" class="tc-btn btn-dark w-full">Сменить пароль</button>
      <a href="{% url 'users:profile' %}" class="tc-btn btn-secondary w-full" style="text-decoration:none;display:flex;">Назад</a>
    </div>
  </form>
</div>
{% endblock %}
