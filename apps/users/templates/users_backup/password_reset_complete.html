{% extends "catalog/base.html" %}
{% load static %}
{% block title %}Пароль изменён{% endblock %}
{% block body_extra_class %} grey-theme{% endblock %}
{% block content %}
<div style="display:flex;justify-content:center;padding:40px 20px;">
  <div style="width:100%;max-width:488px;">
    <div class="bg-white rounded-3xl p-6 md:p-8 text-center">
      <div class="w-16 h-16 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6">
        <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
      </div>
      <p class="text-[40px] font-din-black uppercase leading-[1.2] mb-3">Готово!</p>
      <p class="text-sm text-gray-400 mb-8">Ваш пароль успешно изменён. Теперь вы можете войти с новым паролем.</p>
      <a href="{% url 'login' %}" class="tc-btn btn-dark w-full inline-block text-center">Войти</a>
    </div>
  </div>
</div>
{% endblock %}
