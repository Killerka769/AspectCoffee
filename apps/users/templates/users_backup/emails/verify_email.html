<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Код подтверждения — Aspect Coffee</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#0a0a0a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:24px;overflow:hidden;">
        <tr>
          <td style="padding:48px 40px;text-align:center;">
            <h1 style="margin:0 0 16px;font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;">{{ site_name }}</h1>
            <p style="margin:0 0 32px;font-size:14px;color:#666;">Код подтверждения вашего email</p>
            
            <div style="background:#f8f8f8;border-radius:16px;padding:24px;margin:0 0 32px;">
              <p style="margin:0 0 8px;font-size:12px;color:#999;text-transform:uppercase;letter-spacing:0.1em;">Ваш код</p>
              <p style="margin:0;font-size:48px;font-weight:900;letter-spacing:0.15em;color:#0a0a0a;">{{ code }}</p>
            </div>
            
            <p style="margin:0 0 16px;font-size:13px;color:#999;">Код действителен 15 минут</p>
            <p style="margin:0;font-size:12px;color:#bbb;">Если вы не регистрировались, просто проигнорируйте это письмо</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
