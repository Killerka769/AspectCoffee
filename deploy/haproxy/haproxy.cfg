global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 10s
    timeout client 2h
    timeout server 2h

frontend public_https
    bind 45.155.52.48:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    acl customer_ip src 95.31.19.131/32
    acl test_sni req.ssl_sni -i test.aspectcoffee.ru

    use_backend test_site_https if customer_ip test_sni
    use_backend test_blocked_https if test_sni
    use_backend customer_site_https if customer_ip
    default_backend openvpn_tls

backend customer_site_https
    server nginx_https 10.88.0.1:443 check

backend test_site_https
    server nginx_test_https 10.88.0.1:8444 check

backend test_blocked_https
    server nginx_test_blocked_https 10.88.0.1:8445 check

backend openvpn_tls
    server stunnel_openvpn 127.0.0.1:8443 check

frontend public_http
    bind 45.155.52.48:80
    mode http

    acl customer_ip src 95.31.19.131/32
    acl acme_challenge path_beg /.well-known/acme-challenge/
    acl test_host hdr(host) -i test.aspectcoffee.ru

    http-request deny deny_status 503 if test_host !customer_ip !acme_challenge
    http-request deny deny_status 403 if !customer_ip !acme_challenge
    use_backend test_site_http if test_host
    default_backend customer_site_http

backend customer_site_http
    mode http
    server nginx_http 10.88.0.1:80 check

backend test_site_http
    mode http
    server nginx_test_http 10.88.0.1:8080 check
